<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Catalog</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Design Catalog">
<meta name="theme-color" content="#14171c">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/store.css">
</head>
<body>

<div id="offline-banner">You're offline — showing the last synced catalog.</div>

<header class="hero">
  <h1 id="business-name">Design Catalog</h1>
  <p id="hero-sub">Browse available designs — order online or request a quote.</p>
</header>

<div class="controls">
  <input id="search-input" type="text" placeholder="Search by name or Pokédex #…">
  <div class="chip-row" id="category-chips">
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="character">Character</button>
    <button class="chip" data-cat="standard">Standard</button>
    <button class="chip" data-cat="model">Extras</button>
  </div>
  <div class="chip-row" id="type-chips" style="display:none;">
    <button class="chip active" data-type="all">All types</button>
  </div>
</div>

<main>
  <div id="result-count"></div>
  <div id="featured-section" style="display:none;">
    <div class="section-heading">Featured</div>
    <div id="featured-grid" class="grid"></div>
    <div class="section-heading">All designs</div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty-state">
    <div>Nothing matches that search or filter.</div>
  </div>
</main>

<div id="modal-backdrop">
  <div id="modal"></div>
</div>

<button id="quote-cart-btn" class="quote-cart-btn" style="display:none;">
  Request quote <span id="quote-cart-count">0</span>
</button>

<div id="quote-backdrop">
  <div id="quote-modal"></div>
</div>

<div id="kiosk-toast"></div>

<script src="/assets/store.js"></script>
</body>
</html>
